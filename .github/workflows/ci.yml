name: macOS Swift CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build Swift package
        run: swift build

      - name: Run self-contained regression tests
        run: ./Scripts/run-tests.sh
